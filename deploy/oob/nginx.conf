map $http_upgrade $oob_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    # 静态导出目录补斜杠时返回相对地址，保留宿主映射的 8000 端口。
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    # 与已有 API 的请求大小上限一致，避免代理提前拒绝介质库上传。
    client_max_body_size 16g;

    location = /health {
        proxy_pass http://api:5080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
        proxy_pass http://api:5080;
        proxy_http_version 1.1;
        # 原样保留浏览器 Host/端口，维持 Cookie 与 WebSocket 来源校验。
        proxy_set_header Host $http_host;
        # 仅报告本跳实际来源，不能把请求自带的转发链当作可信客户端身份。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oob_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # MCP、OAuth 与发现文档使用真实协议响应，不能落入静态页面回退。
    location ~ ^/(mcp|connect|\.well-known)(/|$) {
        proxy_pass http://api:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        # 两跳 TLS 终止仍须按实际拓扑配置可信代理；此处不采信外部传入的协议头。
        proxy_buffering off;
        proxy_request_buffering off;
        # 为应用最多120秒的查询额外保留传输余量，避免代理先于业务超时断开。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # OAuth 查询中含授权上下文，完整请求不进入 Nginx 访问日志。
        access_log off;
    }

    # 已退役文档入口明确返回404，不以SPA首页伪装为仍有服务。
    location ~ ^/(swagger|openapi)([/.]|$) {
        return 404;
    }

    location / {
        # 直接读取静态导出的入口文件，避免补斜杠改变 Umi 的登录回跳路径。
        try_files $uri $uri/index.html /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
