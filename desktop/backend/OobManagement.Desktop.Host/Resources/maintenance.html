<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>带外管理 · 本地维护</title><style nonce="{{nonce}}">body{font:16px system-ui,sans-serif;background:#f5f7fa;color:#172033;padding:32px;line-height:1.8}main{max-width:640px;margin:auto;background:white;padding:32px;border-radius:12px}button{font:inherit;color:white;background:#1677ff;padding:10px 24px;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}a{color:#1677ff}#message{white-space:pre-wrap}</style></head><body><main><h1>本地数据维护</h1><p>备份包含数据库、凭据解密密钥、介质文件与操作记录。请将备份保存在受保护的位置。</p><p>请先在主窗口登录系统管理员账号，再执行备份。</p><button id="backup">生成并下载备份</button><p id="message" role="status" aria-live="polite"></p><p>恢复时先退出程序，将备份恢复到新的数据目录。具体命令见桌面版运行说明。</p><a href="/">返回主页面</a></main><script nonce="{{nonce}}">document.querySelector('#backup').addEventListener('click',async()=>{const button=document.querySelector('#backup'),message=document.querySelector('#message');button.disabled=true;message.textContent='正在生成备份…';try{const tokenResponse=await fetch('/desktop/csrf');const token=await tokenResponse.json();const response=await fetch('/desktop/backup',{method:'POST',headers:{'X-CSRF-TOKEN':token.data.token}});if(!response.ok){const result=await response.json();throw new Error(result.errorMessage||result.message||'请先在主窗口登录系统管理员')}const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='OutOfBandManagement-backup.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);message.textContent='备份已生成，请确认下载位置。'}catch(error){message.textContent=error.message}finally{button.disabled=false}});</script></body></html>
