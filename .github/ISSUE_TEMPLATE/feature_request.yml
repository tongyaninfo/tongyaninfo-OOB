name: 功能建议
description: 提出新的功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请描述使用场景与期望行为；不要包含真实客户信息、凭据或内网地址。

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 后端 / API
        - PC 管理端
        - 桌面版
        - MCP / OAuth
        - 部署与配置
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你正在解决什么问题？涉及哪些设备、角色或流程？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述期望的功能表现或界面流程
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法或临时绕过方式（可选）

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认该建议不包含真实凭据、客户信息或内网地址
          required: true
